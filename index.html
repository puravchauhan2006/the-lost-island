<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>The Lost Island - 3D Edition</title>
<!-- Three.js for 3D Graphics & PeerJS for Multiplayer -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050b14;color:white;font-family:Arial,sans-serif;text-align:center;overflow:hidden}
header{position:absolute;top:0;left:0;width:100%;padding:6px;background:rgba(10,25,20,0.85);border-bottom:1px solid #1e4a38;z-index:10}
h1{color:#ffd166;margin:2px;font-size:18px}
p{color:#98c2ab;margin:2px;font-size:10px}
.menu{position:absolute;top:45px;left:50%;transform:translateX(-50%);background:rgba(20,40,30,0.9);padding:6px 12px;border-radius:6px;display:flex;gap:5px;z-index:10;align-items:center}
button,input{padding:6px 10px;border:0;border-radius:4px;font-weight:bold;font-size:11px}
button{background:#ffd166;color:#172a20;cursor:pointer}
input{width:100px;background:#fff;color:#111}
#status{position:absolute;top:90px;left:50%;transform:translateX(-50%);font-size:11px;color:#a9e6c4;z-index:10;text-shadow:1px 1px 2px #000}
.stats{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:15px;padding:6px 12px;background:rgba(10,25,20,0.85);border-radius:6px;font-size:12px;z-index:10}
.stats b{color:#ffd166}
.controls{position:absolute;bottom:50px;left:50%;transform:translateX(-50%);display:grid;grid-template-columns:50px 50px 50px;grid-template-rows:40px 40px 40px;gap:4px;z-index:10}
.controls button{font-size:16px;background:rgba(49,91,67,0.8);color:white;border:1px solid #6aa282;touch-action:none}
.up{grid-column:2}.left{grid-column:1;grid-row:2}
.down{grid-column:2;grid-row:2}.right{grid-column:3;grid-row:2}
@media(min-width:800px){.controls{display:none}}
#webgl-container{width:100vw;height:100vh;display:block}
</style>
</head>
<body>
<header>
<h1>🏝️ THE LOST ISLAND: 3D</h1>
<p>Explore the 3D Open World • Collect Gold • Unlock the Temple</p>
</header>

<div class="menu">
<button onclick="createRoom()">HOST</button>
<input id="room" placeholder="Room ID">
<button onclick="joinRoom()">JOIN</button>
<button onclick="copyRoom()">COPY ID</button>
</div>
<div id="status">Host or Join a room to start.</div>

<div class="stats">
<span>👥 Players: <b id="count">1</b></span>
<span>🪙 Coins: <b id="score">0</b></span>
<span>🗝️ Relics: <b id="keycount">0</b>/3</span>
</div>

<div class="controls">
<button class="up" data-k="up">▲</button>
<button class="left" data-k="left">◀</button>
<button class="down" data-k="down">▼</button>
<button class="right" data-k="right">▶</button>
</div>

<div id="webgl-container"></div>

<script>
// --- THREE.JS 3D SCENE SETUP ---
const container = document.getElementById("webgl-container");
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb); // Sky blue
scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);

const sunLight = new THREE.DirectionalLight(0xfffaed, 0.8);
sunLight.position.set(50, 100, 50);
sunLight.castShadow = true;
scene.add(sunLight);

// Ocean (Water Plane)
const oceanGeo = new THREE.PlaneGeometry(1000, 1000);
const oceanMat = new THREE.MeshBasicMaterial({color: 0x1e90ff});
const ocean = new THREE.Mesh(oceanGeo, oceanMat);
ocean.rotation.x = -Math.PI/2;
ocean.position.y = -0.5;
scene.add(ocean);

// Island Ground
const islandGeo = new THREE.CylinderGeometry(70, 75, 2, 32);
const islandMat = new THREE.MeshStandardMaterial({color: 0x2e8b57, roughness: 0.8});
const island = new THREE.Mesh(islandGeo, islandMat);
island.position.y = -1;
island.receiveShadow = true;
scene.add(island);

// Add 3D Trees
for(let i=0; i<35; i++){
 const angle = Math.random() * Math.PI * 2;
 const dist = Math.random() * 55;
 const x = Math.cos(angle) * dist;
 const z = Math.sin(angle) * dist;

 // Trunk
 const trunkGeo = new THREE.CylinderGeometry(0.8, 1.2, 4, 8);
 const trunkMat = new THREE.MeshStandardMaterial({color: 0x8b4513});
 const trunk = new THREE.Mesh(trunkGeo, trunkMat);
 trunk.position.set(x, 1, z);
 scene.add(trunk);

 // Leaves
 const leavesGeo = new THREE.ConeGeometry(3, 5, 8);
 const leavesMat = new THREE.MeshStandardMaterial({color: 0x006400});
 const leaves = new THREE.Mesh(leavesGeo, leavesMat);
 leaves.position.set(x, 3.5, z);
 scene.add(leaves);
}

// --- GAME STATE & MULTIPLAYER ---
let peer=null, host=false, roomId="";
let connections=[];
let players={};
let coins=[], keys=[];
let teamKeys=0;
let score=0;
let pressed={};
let myId="";

const me = {x:0, z:0, color:0xffd166};
let playerMeshes = {};

// Create Coins and Relics in 3D Space
function setupWorld(){
 coins = []; keys = [];
 for(let i=0; i<20; i++){
  const angle = Math.random() * Math.PI * 2;
  const dist = Math.random() * 50;
  coins.push({x: Math.cos(angle)*dist, z: Math.sin(angle)*dist, taken:false});
 }
 for(let i=0; i<3; i++){
  keys.push({x: (i-1)*20, z: -30 + i*10, taken:false});
 }
}
setupWorld();

// Visual meshes for collectibles
let coinMeshes = [];
coins.forEach(c => {
 const geo = new THREE.CylinderGeometry(1.2, 1.2, 0.3, 16);
 const mat = new THREE.MeshStandardMaterial({color: 0xffd700, metalness: 0.5});
 const mesh = new THREE.Mesh(geo, mat);
 mesh.position.set(c.x, 0.2, c.z);
 mesh.rotation.x = Math.PI/2;
 scene.add(mesh);
 coinMeshes.push(mesh);
});

let keyMeshes = [];
keys.forEach(k => {
 const geo = new THREE.BoxGeometry(1.5, 1.5, 1.5);
 const mat = new THREE.MeshStandardMaterial({color: 0xff4500, roughness: 0.2});
 const mesh = new THREE.Mesh(geo, mat);
 mesh.position.set(k.x, 1, k.z);
 scene.add(mesh);
 keyMeshes.push(mesh);
});

// PeerJS Networking
function say(t){document.getElementById("status").textContent=t;}

function createRoom(){
 if(!window.Peer){say("PeerJS error."); return;}
 host = true;
 peer = new Peer();
 peer.on("open", id => {
  roomId = id; myId = id;
  players[id] = {x:0, z:0, score:0, color:0xffd166};
  say("Room hosted! ID: "+id);
  sync();
 });
 peer.on("connection", conn => {
  connections.push(conn);
  let col = [0xff69b4, 0x00ffff, 0xda70d6, 0x00fa9a][Object.keys(players).length%4];
  players[conn.peer] = {x:0, z:0, score:0, color:col};
  conn.on("open", () => { conn.send({type:"state", state:getState()}); sync(); say("Explorer joined!"); });
  conn.on("data", data => {
   if(data.type==="move"){
    let p = players[conn.peer];
    if(p){ p.x = data.x; p.z = data.z; collect(conn.peer); sync(); }
   }
  });
  conn.on("close", () => { delete players[conn.peer]; sync(); });
 });
}

function joinRoom(){
 let id = document.getElementById("room").value.trim();
 if(!id){ say("Enter Room ID."); return; }
 host = false;
 peer = new Peer();
 peer.on("open", myPeerId => {
  myId = myPeerId;
  let conn = peer.connect(id, {reliable:true});
  connections = [conn];
  conn.on("open", () => { roomId = id; say("Connected to 3D Island!"); });
  conn.on("data", data => { if(data.type==="state") applyState(data.state); });
  conn.on("close", () => say("Disconnected."));
 });
}

function copyRoom(){
 if(!roomId){ say("No Room ID yet."); return; }
 navigator.clipboard?.writeText(roomId).then(()=>say("ID Copied!"));
}

function getState(){ return {players, coins, keys, teamKeys}; }
function sync(){
 connections = connections.filter(c => c.open);
 let state = getState();
 connections.forEach(c => { try{ c.send({type:"state", state}); }catch(e){} });
 updateStats();
}

function applyState(state){
 players = state.players; coins = state.coins; keys = state.keys; teamKeys = state.teamKeys;
 updateStats();
}

function updateStats(){
 document.getElementById("count").textContent = Object.keys(players).length;
 document.getElementById("score").textContent = players[myId]?.score || score;
 document.getElementById("keycount").textContent = teamKeys;
}

function collect(id){
 let p = players[id];
 if(!p) return;
 coins.forEach((c, idx) => {
  if(!c.taken && Math.hypot(p.x - c.x, p.z - c.z) < 2.5){
   c.taken = true; p.score = (p.score||0) + 1;
   if(coinMeshes[idx]) coinMeshes[idx].visible = false;
   if(id === myId) score = p.score;
  }
 });
 keys.forEach((k, idx) => {
  if(!k.taken && Math.hypot(p.x - k.x, p.z - k.z) < 2.8){
   k.taken = true; teamKeys++;
   if(keyMeshes[idx]) keyMeshes[idx].visible = false;
  }
 });
}

// Input Controls
window.addEventListener("keydown", e => { pressed[e.key.toLowerCase()] = true; });
window.addEventListener("keyup", e => { pressed[e.key.toLowerCase()] = false; });

document.querySelectorAll("[data-k]").forEach(b => {
 let k = b.dataset.k;
 b.addEventListener("pointerdown", e => { e.preventDefault(); pressed[k] = true; });
 ["pointerup","pointerleave","pointercancel"].forEach(ev => { b.addEventListener(ev, () => pressed[k] = false); });
});

// Game Loop
function animate(){
 requestAnimationFrame(animate);

 // Movement logic
 let dx=0, dz=0;
 if(pressed.arrowleft || pressed.a || pressed.left) dx -= 1;
 if(pressed.arrowright || pressed.d || pressed.right) dx += 1;
 if(pressed.arrowup || pressed.w || pressed.up) dz -= 1;
 if(pressed.arrowdown || pressed.s || pressed.down) dz += 1;

 if(dx || dz){
  let speed = 0.25;
  let len = Math.hypot(dx, dz);
  me.x += (dx/len) * speed;
  me.z += (dz/len) * speed;

  // Keep player inside island boundaries
  let distFromCenter = Math.hypot(me.x, me.z);
  if(distFromCenter > 65){ me.x *= 65/distFromCenter; me.z *= 65/distFromCenter; }

  if(host){
   players[myId] = me;
   collect(myId);
   sync();
  } else if(peer && roomId){
   connections.forEach(c => { if(c.open) c.send({type:"move", x:me.x, z:me.z}); });
  }
 }

 // Render / Update 3D Player Meshes
 Object.entries(players).forEach(([id, p]) => {
  if(!playerMeshes[id]){
   const pGeo = new THREE.BoxGeometry(1.5, 2.5, 1.5);
   const pMat = new THREE.MeshStandardMaterial({color: p.color || 0xffd166});
   const mesh = new THREE.Mesh(pGeo, pMat);
   mesh.castShadow = true;
   scene.add(mesh);
   playerMeshes[id] = mesh;
  }
  let mesh = playerMeshes[id];
  mesh.position.set(p.x, 1.25, p.z);
 });

 // Remove disconnected players
 Object.keys(playerMeshes).forEach(id => {
  if(!players[id]){
   scene.remove(playerMeshes[id]);
   delete playerMeshes[id];
  }
 });

 // Camera follow local player
 if(players[myId]){
  camera.position.set(players[myId].x, players[myId].y + 12, players[myId].z + 16);
  camera.lookAt(players[myId].x, 0, players[myId].z);
 }

 renderer.render(scene, camera);
}
animate();

// Handle browser window resizing
window.addEventListener("resize", () => {
 camera.aspect = window.innerWidth / window.innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
  </html>
